<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>塔防 · Tower Defense</title>
  <style>
    /* 配色由 src/game/main.ts 在运行时写进这些变量：独立页用内置三套，嵌进 Hikos 时跟宿主皮肤（skin / accent / bg / ink / theme）走 */
    :root { --td-bg: #11161d; --td-paper: #2b3846; --td-ink: #e8e8e8; --td-hair: #555; --td-accent: #ffd36a; --td-danger: #ff9a8a; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--td-bg); color: var(--td-ink); font-family: "IBM Plex Sans", "PingFang SC", system-ui, sans-serif; overflow: hidden; }
    #game-container { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; box-sizing: border-box; height: 100%; }
    #hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 16px; }
    #hud .stats { font-variant-numeric: tabular-nums; }
    #hud button, #hud select { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--td-hair); background: var(--td-paper); color: var(--td-ink); cursor: pointer; font: inherit; font-size: 14px; }
    #hud button.sel { border-color: var(--td-accent); box-shadow: inset 0 0 0 1px var(--td-accent); }
    #hud button:disabled { opacity: .4; cursor: default; }
    #hud button.exit { margin-left: 8px; opacity: .8; }
    .toast { color: var(--td-danger); }
    #board { max-width: 100%; height: auto; cursor: crosshair; border-radius: 4px; }
    #debug { font: 12px monospace; background: #000a; color: #eee; padding: 6px 10px; margin: 0; max-width: 672px; white-space: pre-wrap; }
    /* 军师卡片（src/game/advisorCard.ts）：一次只显示当前这条建议；选项横排、窄屏自动换行 */
    #advisor { width: min(100%, 672px); box-sizing: border-box; background: color-mix(in srgb, var(--td-paper) 70%, transparent); border: 1px solid var(--td-hair); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.35; }
    #advisor:empty { display: none; }
    #advisor p { margin: 3px 0; }
    #advisor .adv-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #advisor .adv-avatar, #lobby .lobby-adv-av { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; flex-shrink: 0; vertical-align: middle; }
    #advisor .adv-avatar-glyph, #lobby .lobby-adv-glyph { display: inline-flex; align-items: center; justify-content: center; background: var(--adv-c, var(--td-accent)); color: #fff; font-size: 12px; font-weight: bold; clip-path: polygon(50% 4%, 96% 50%, 50% 96%, 4% 50%); }
    #advisor .adv-title { font-weight: bold; }
    #advisor .adv-persona, #lobby .lobby-persona { font-size: 12px; opacity: .82; color: #b9cadc; margin: 2px 0 4px; }
    #advisor .adv-stream { font: 11px monospace; opacity: .8; color: var(--td-accent); white-space: pre-wrap; word-break: break-all; }
    #advisor .adv-badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--td-hair); opacity: .85; }
    #advisor .adv-badge.llm { border-color: var(--td-accent); color: var(--td-accent); }
    #advisor .adv-score { margin-left: auto; font-variant-numeric: tabular-nums; }
    #advisor .adv-auto { font-size: 12px; opacity: .85; cursor: pointer; }
    #advisor .adv-say { color: var(--td-accent); }
    #advisor .adv-notice { color: var(--td-danger); }
    #advisor .adv-betline { color: var(--td-accent); font-weight: bold; }
    #advisor .adv-options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    #advisor .adv-opt { flex: 1 1 180px; border: 1px solid var(--td-hair); border-radius: 6px; padding: 5px 8px; display: flex; flex-direction: column; gap: 2px; }
    #advisor .adv-opt .adv-moves { font-size: 12px; opacity: .8; margin-left: 6px; }
    #advisor .adv-why { opacity: .95; }
    #advisor .adv-risk, #advisor .adv-reject { font-size: 12px; opacity: .75; }
    #advisor .adv-reject { color: var(--td-danger); }
    #advisor button { align-self: flex-start; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--td-hair); background: var(--td-paper); color: var(--td-ink); cursor: pointer; font: inherit; font-size: 12px; }
    #advisor button:disabled { opacity: .4; cursor: default; }
    #advisor .adv-gambit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
    #advisor .adv-outcome.bad { color: var(--td-danger); }
    #lobby { position: fixed; inset: 0; background: rgba(8,10,14,.82); display: none; overflow-y: auto; padding: 12px 12px 104px; box-sizing: border-box; }
    #lobby .card { max-width: 560px; max-height: calc(100dvh - 120px); overflow-y: auto; margin: 20px auto; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px 20px; color: #e8e8e8; box-sizing: border-box; }
    #lobby h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
    #lobby textarea { width: 100%; box-sizing: border-box; background: #0e1116; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px; font: inherit; }
    #lobby .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    #lobby #summary .row { position: sticky; bottom: -12px; z-index: 2; padding: 8px 0 4px; background: inherit; backdrop-filter: blur(8px); }
    #lobby button { padding: 6px 14px; border-radius: 6px; border: 1px solid #666; background: #2b3846; color: #eee; cursor: pointer; }
    #lobby button:disabled { opacity: .55; cursor: default; }
    #lobby .echo { color: #E8C170; } #lobby .warn { color: #ffcf6a; } #lobby .err { color: #ff9a8a; } #lobby .dry { color: #9fb3c8; font-size: 14px; }
    #lobby small { color: #9fb3c8; font-weight: normal; font-size: 12px; }
    #lobby .stream-box { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(14,17,22,.75); border: 1px solid rgba(255,211,106,.35); }
    #lobby .stream-stage { margin: 0 0 4px; color: #ffd36a; font-size: 13px; font-weight: 600; }
    #lobby .stream-parsed { margin: 0 0 4px; color: #9fb3c8; font-size: 12px; }
    #lobby .stream-log { margin: 0; max-height: 96px; overflow: hidden; font: 11px/1.35 monospace; color: #cfd8e3; white-space: pre-wrap; word-break: break-all; }
    /* 空间皮肤地图原位模式（data-insitu="true"）：画布与背景全透明，直接透出宿主 #hub-view 3D 地图；HUD / 军师卡 / 军师议事收作边缘毛玻璃浮卡，不遮挡地图中心战场 */
    html[data-insitu="true"], html[data-insitu="true"] body { background: transparent !important; }
    html[data-insitu="true"] #game-container { position: relative; width: 100%; height: 100%; padding: 0; gap: 0; overflow: hidden; background: transparent !important; }
    html[data-insitu="true"] #board { position: absolute; inset: 0; width: 100% !important; height: 100% !important; max-width: none; border-radius: 0; background: transparent !important; z-index: 1; }
    html[data-insitu="true"] #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 240px); padding: 6px 14px; border-radius: 10px; background: color-mix(in srgb, var(--td-paper) 86%, transparent); border: 1px solid var(--td-hair); backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(0,0,0,.16); font-size: 14px; }
    html[data-insitu="true"] #advisor { position: absolute; left: 16px; top: 64px; z-index: 3; width: min(350px, calc(100% - 32px)); max-height: calc(100% - 176px); overflow: auto; background: color-mix(in srgb, var(--td-paper) 86%, transparent); backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(0,0,0,.16); }
    html[data-insitu="true"] #lobby { position: absolute; top: 58px; right: 16px; left: auto; bottom: 104px; inset: 58px 16px 104px auto; width: min(340px, calc(100% - 32px)); padding: 0; background: transparent; z-index: 4; pointer-events: none; overflow: visible; display: flex; flex-direction: column; }
    html[data-insitu="true"] #lobby .card { margin: 0; max-width: none; max-height: 100%; overflow-y: auto; padding: 12px 14px; background: color-mix(in srgb, var(--td-paper) 92%, transparent); color: var(--td-ink); border: 1px solid var(--td-hair); backdrop-filter: blur(10px); box-shadow: 0 6px 20px rgba(0,0,0,.22); pointer-events: auto; }
    html[data-insitu="true"] #lobby #summary .row { position: sticky; bottom: -12px; padding: 8px 0 4px; background: color-mix(in srgb, var(--td-paper) 95%, transparent); }
    html[data-insitu="true"] #lobby textarea { background: color-mix(in srgb, var(--td-bg) 80%, transparent); color: var(--td-ink); border-color: var(--td-hair); }
    html[data-insitu="true"] #lobby button { background: var(--td-paper); color: var(--td-ink); border-color: var(--td-hair); }
    html[data-insitu="true"] #lobby small, html[data-insitu="true"] #lobby .dry, html[data-insitu="true"] #lobby .lobby-persona { color: var(--td-ink); opacity: .82; }
    html[data-insitu="true"] #debug { position: absolute; right: 16px; bottom: 112px; z-index: 3; }
    @media (max-width: 760px) {
      html[data-insitu="true"] #hud { top: 8px; left: 8px; right: 8px; transform: none; max-width: none; }
      html[data-insitu="true"] #advisor { left: 8px; right: 8px; top: auto; bottom: 108px; width: auto; max-height: 36%; }
      html[data-insitu="true"] #lobby { top: 68px; right: 8px; left: 8px; width: auto; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <!-- D1 entry: new deterministic runtime. Legacy src/main.js + src/runtime.js are kept (not deleted) for migration reference. -->
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
